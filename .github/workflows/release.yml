name: release

# 打 tag 时自动做三件事：校验、打包、把两个 tarball 传到该 tag 的 GitHub Release。
# 手动触发时传 tag 参数，可以补传历史版本的资产（例如重跑 v0.6.1）。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（例如 v0.6.1），必须是已存在的 tag'
        required: true
        type: string

permissions:
  contents: write
  id-token: write # npm provenance（Sigstore 签名）

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 取代码（tag 推送取 tag，手动触发取输入的 tag）
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org

      - uses: pnpm/action-setup@v6
        with:
          version: '11'

      - name: 安装构建依赖
        run: pnpm install --frozen-lockfile

      - name: 构建产物必须与源码一致
        run: |
          node scripts/build.mjs
          if ! git diff --exit-code -- lib/client.js; then
            echo "::error::lib/client.js 与 src/client/ 不一致，请本地 pnpm build 后提交"
            exit 1
          fi

      - name: 发布包自检（打包 → 安装 → 加载 → 跑 worker）
        run: node --test tests/release-tarball.test.js

      - name: 打包（带版本号 + 稳定名）
        run: node scripts/pack-release.mjs

      - name: 上传到 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          echo "发布 $TAG"
          ls -l dist
          # 预发布版本（tag 里带 -，如 v0.7.0-rc.1）标成 prerelease，
          # 避免 releases/latest 被预发布包占走（市场稳定名指向 latest）。
          PRE=()
          case "$TAG" in
            *-*) PRE=(--prerelease) ;;
          esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release 已存在，覆盖资产"
          else
            gh release create "$TAG" --title "$TAG" --generate-notes "${PRE[@]}"
          fi
          gh release upload "$TAG" dist/*.tgz --clobber
          gh release view "$TAG" --json tagName,assets --jq '{tag:.tagName, assets:[.assets[].name]}'

      - name: 验证稳定名地址可下载
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          # 只有「最新 release」才有 releases/latest/download；历史 tag 用带 tag 的地址校验
          URL="https://github.com/${{ github.repository }}/releases/download/$TAG/dsh-memory-evolve.tgz"
          code=$(curl -sIL -o /dev/null -w '%{http_code}' "$URL")
          echo "$URL → $code"
          test "$code" = "200"

      # GITHUB_TOKEN 无权派发别的 workflow（403 Resource not accessible by integration），
      # 也触发不了 release: published，所以正式版本在这里直接发 npm。
      # 预发布 tag（带 -）不发 npm，避免把 rc 包推成 latest。
      - name: 发布到 npm（正式版）
        if: ${{ !contains(github.event.inputs.tag || github.ref_name, '-') }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::缺少 NPM_TOKEN secret：请在仓库 Settings → Secrets and variables → Actions 里添加"
            exit 1
          fi
          VERSION="${TAG#v}"
          NAME=$(node -p "require('./package.json').name")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "npm 上已经有 $NAME@$VERSION，跳过发布（可重复执行）"
            exit 0
          fi
          # 发布刚才自检过、并已上传到 Release 的那个 tarball，保证「测的就是发的」
          npm publish "dist/dsh-memory-evolve-$VERSION.tgz" --access public --provenance
          for i in 1 2 3 4 5 6; do
            if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
              echo "npm 已上架：$NAME@$VERSION"
              exit 0
            fi
            sleep 10
          done
          echo "::error::发布后 60 秒内没在 registry 查到 $NAME@$VERSION"
          exit 1
